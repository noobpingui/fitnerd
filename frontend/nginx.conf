server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # LA linea importante para una SPA: react-router maneja rutas
        # como /coach o /categories/x del lado del cliente (JS), nunca
        # existieron como archivos reales. Sin esto, entrar directo a
        # fitnerd.app/coach (o refrescar la pagina ahi) le pediria a nginx
        # un archivo "coach" que no existe -> 404. try_files le dice:
        # "si no encontras ese archivo, serví index.html igual" - ahi
        # React Router toma el control y muestra la pantalla correcta.
        try_files $uri /index.html;
    }
}